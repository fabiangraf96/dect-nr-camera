# Per-instance UART switches for the nRF9131 EK, where the link is uart3.
#
# Instance 2 is not available here: on the nRF91 each instance number is shared
# by SPIM, SPIS, TWIM, TWIS and UARTE, and the EK spends instance 2 on i2c2 for
# the nPM1300 PMIC. Instance 3 is spent on spi3 for an external flash that the
# board already leaves disabled, so the overlay reclaims it.
#
# Stated explicitly even though nothing here enables interrupt-driven UART
# today: on the transmitter, adding the shell flipped the link uart to
# interrupt-driven and silently broke the async API. Pin it down so the same
# trap cannot be sprung by a future addition.
CONFIG_UART_3_INTERRUPT_DRIVEN=n
CONFIG_UART_3_ASYNC=y
