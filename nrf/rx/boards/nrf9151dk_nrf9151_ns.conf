# Per-instance UART switches for the nRF9151 DK, where the link is uart2.
#
# These cannot live in prj.conf: the symbol name carries the instance number,
# and the nRF9131 EK has to use uart3 because instance 2 is its PMIC i2c.
#
# Stated explicitly even though nothing here enables interrupt-driven UART
# today: on the transmitter, adding the shell flipped the link uart to
# interrupt-driven and silently broke the async API. Pin it down so the same
# trap cannot be sprung by a future addition.
CONFIG_UART_2_INTERRUPT_DRIVEN=n
CONFIG_UART_2_ASYNC=y
