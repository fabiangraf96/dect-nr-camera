# DECT camera receiver

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Modem + DECT NR+ PHY
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n

CONFIG_HWINFO=y

# Link uart -> VCOM1 -> USB. Async so EasyDMA streams without a per-byte
# interrupt. Which UART instance that is depends on the board, so the
# per-instance switches live in boards/<board>.conf next to the overlay that
# chooses it.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_RING_BUFFER=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
# Without this Zephyr renders every %f in a log message as the literal
# "*float*", which silently destroys all the rate statistics.
CONFIG_CBPRINTF_FP_SUPPORT=y
# Deferred: logging happens on VCOM0 and must never stall the radio callback
# or the VCOM1 data path.
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
