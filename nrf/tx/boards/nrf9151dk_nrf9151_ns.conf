# Per-instance UART switches for the nRF9151 DK, where the camera link is uart2.
#
# These cannot live in prj.conf: the symbol name carries the instance number,
# and the nRF9131 EK has to use uart3 because instance 2 is its PMIC i2c.
#
# The nRF UARTE driver picks the mode per instance, and Kconfig says:
#     config UART_2_ASYNC
#         depends on UART_ASYNC_API && !UART_2_INTERRUPT_DRIVEN
#         default y
#
# Enabling the shell turns on CONFIG_UART_INTERRUPT_DRIVEN, which defaults
# UART_2_INTERRUPT_DRIVEN to y and therefore silently disables async on uart2.
# uart_callback_set() then returns -ENOSYS, uart_in_init() fails and main()
# halts -- while the shell keeps answering from its own thread, so the board
# looks perfectly healthy. That cost a long debugging session.
CONFIG_UART_2_INTERRUPT_DRIVEN=n
CONFIG_UART_2_ASYNC=y
