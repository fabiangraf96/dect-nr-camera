# Per-instance UART switches for the nRF9131 EK, where the camera link is uart3.
#
# Instance 2 is not available here: on the nRF91 each instance number is shared
# by SPIM, SPIS, TWIM, TWIS and UARTE, and the EK spends instance 2 on i2c2 for
# the nPM1300 PMIC. Instance 3 is spent on spi3 for an external flash that the
# board already leaves disabled, so the overlay reclaims it.
#
# The nRF UARTE driver picks the mode per instance, and Kconfig says:
#     config UART_3_ASYNC
#         depends on UART_ASYNC_API && !UART_3_INTERRUPT_DRIVEN
#         default y
#
# Enabling the shell turns on CONFIG_UART_INTERRUPT_DRIVEN, which defaults
# UART_3_INTERRUPT_DRIVEN to y and therefore silently disables async on the
# link uart. uart_callback_set() then returns -ENOSYS, uart_in_init() fails and
# main() halts -- while the shell keeps answering from its own thread, so the
# board looks perfectly healthy. That cost a long debugging session on the DK.
CONFIG_UART_3_INTERRUPT_DRIVEN=n
CONFIG_UART_3_ASYNC=y
