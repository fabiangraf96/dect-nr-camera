# DECT camera transmitter

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Modem + DECT NR+ PHY
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n

CONFIG_HWINFO=y

# UART link from the camera board. Async so EasyDMA does the work; a polled or
# interrupt-per-byte driver cannot keep up with 1 Mbaud alongside the radio.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_RING_BUFFER=y

# The link uart MUST be async, uart0 MUST stay interrupt-driven for the shell.
# The per-instance switches carry the instance number in the symbol name, so
# they live in boards/<board>.conf next to the overlay that chooses the
# instance: the DK uses uart2, the EK uart3.

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
# Without this Zephyr renders every %f in a log message as the literal
# "*float*", which silently destroys all the rate statistics.
CONFIG_CBPRINTF_FP_SUPPORT=y
# Immediate, not deferred.
#
# With deferred logging plus the shell enabled, nothing at all reached a
# passively captured console -- output only appeared in response to typed
# input. That blinded the whole bring-up: an error at startup was invisible
# and looked like a wiring fault for hours.
#
# Immediate mode costs some latency in the logging call itself, which is an
# easy trade for being able to see what the board is doing.
CONFIG_LOG_MODE_IMMEDIATE=y

# Shell on VCOM0, used to reach the camera over the uart2 back-channel.
#
# The camera board has a console of its own, so this is a convenience rather
# than a necessity: it puts the camera controls on the same terminal as the
# radio statistics, and opening the camera's own port resets it, which throws
# away whatever was set at runtime.
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_PROMPT_UART="dectcam-tx:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=128
# Route logs through the plain UART backend, NOT through the shell.
#
# With CONFIG_SHELL_LOG_BACKEND=y the periodic statistics stopped appearing on
# a passively captured console -- the shell only emitted output in response to
# input. That is fine interactively but useless when a script is watching the
# port, which is how this project is debugged.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
# No colour escapes: the console is usually being captured with `cat`, and
# ANSI sequences make those logs painful to read.
CONFIG_SHELL_VT100_COLORS=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
